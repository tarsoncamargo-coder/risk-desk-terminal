name: Deploy Risk Desk Terminal to GitHub Pages
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check market-visual-live.js
          node --check historico-clean-v8.js
          node --check ui_v2.js
          node --check live-hoje.js
          node --check event-monitor.js
          node --check mt5-shadow-hoje.js
          node --check cross-asset-core.js
          node --check options-core.js
          node --check options-tab.js
          node --check collector/options-collector.mjs
          node --check riskdesk-unified.js
          node --check riskdesk-gold.js
          python -m py_compile pipeline/riskdesk_gold_uploader_j15.py
          node --check riskdesk-event-agenda.js
          node --check j14g-official-releases.js
          node --check j14h-volatility.js
          node tests/confluence-v2.test.cjs
          node tests/site-ui.test.cjs
          node tests/market-visual-live.test.cjs
          node tests/historico-clean-v8.test.cjs
          node tests/mt5-shadow-hoje.test.cjs
          node tests/options-core.test.cjs
          node tests/options-persistence.test.cjs
          node --check ops/macro15m-sanitizer.cjs
          node tests/macro15m-sanitizer.test.cjs
          node --check ops/private-cutover-audit.cjs
          node tests/private-cutover-audit.test.cjs
          node ops/private-cutover-audit.cjs --expect-parallel
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
