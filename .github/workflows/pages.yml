name: Deploy Risk Desk Terminal to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check ui_v2.js
          node --check live-hoje.js
          node --check event-monitor.js
          node --check mt5-shadow-hoje.js
          node --check cross-asset-core.js
          node tests/confluence-v2.test.cjs
          node tests/site-ui.test.cjs
          node tests/mt5-shadow-hoje.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
